name: weather-intelligence-backend

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: weather-intelligence-backend:latest
    container_name: weather-intelligence-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    restart: unless-stopped
